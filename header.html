<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FTC Shared Header</title>
  <style>
    :root{
      --navy:#153f78;
      --text:#172232;
      --red:#ef3123;
      --line:#e7ebef;
      --white:#ffffff;
    }

    *{box-sizing:border-box}

    body{
      margin:0;
      font-family:Arial, Helvetica, sans-serif;
      background:#f5f7f9;
      color:var(--text);
    }

    .site-header{
      width:100%;
      height:78px;
      background:var(--white);
      border-bottom:1px solid var(--line);
      position:sticky;
      top:0;
      z-index:9999;
    }

    .header-container{
      width:min(1180px, calc(100% - 40px));
      height:100%;
      margin:0 auto;
      display:flex;
      align-items:center;
      gap:30px;
    }

    .brand{
      display:flex;
      align-items:center;
      flex-shrink:0;
    }

    .brand img{
      width:275px;
      height:auto;
      display:block;
    }

    .main-nav{
      margin-left:auto;
      display:flex;
      align-items:center;
      gap:30px;
    }

    .main-nav > a:not(.quote-btn){
      position:relative;
      height:78px;
      display:flex;
      align-items:center;
      color:var(--text);
      text-decoration:none;
      font-size:15px;
      font-weight:700;
      white-space:nowrap;
    }

    .main-nav > a:not(.quote-btn):hover,
    .main-nav > a.active:not(.quote-btn){
      color:var(--navy);
    }

    .main-nav > a:not(.quote-btn)::after{
      content:"";
      position:absolute;
      left:50%;
      right:50%;
      bottom:16px;
      height:3px;
      background:var(--red);
      transition:.2s ease;
    }

    .main-nav > a:not(.quote-btn):hover::after,
    .main-nav > a.active:not(.quote-btn)::after{
      left:0;
      right:0;
    }

    .quote-btn{
      min-height:46px;
      padding:0 20px;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      background:var(--red);
      color:#fff;
      text-decoration:none;
      font-size:15px;
      font-weight:800;
      border-radius:4px;
      box-shadow:0 8px 20px rgba(239,49,35,.18);
      white-space:nowrap;
    }

    .menu-toggle{
      display:none;
      margin-left:auto;
      border:0;
      background:transparent;
      color:var(--navy);
      font-size:28px;
      cursor:pointer;
    }

    @media (max-width:900px){
      .site-header{height:72px}

      .header-container{
        width:calc(100% - 28px);
      }

      .brand img{
        width:215px;
        max-width:70vw;
      }

      .menu-toggle{
        display:block;
      }

      .main-nav{
        display:none;
        position:absolute;
        top:72px;
        left:0;
        right:0;
        margin:0;
        padding:10px 20px 20px;
        background:#fff;
        flex-direction:column;
        align-items:stretch;
        gap:0;
        box-shadow:0 12px 25px rgba(0,0,0,.12);
      }

      .main-nav.open{
        display:flex;
      }

      .main-nav > a:not(.quote-btn){
        height:auto;
        padding:14px 4px;
        border-bottom:1px solid #eee;
      }

      .main-nav > a:not(.quote-btn)::after{
        display:none;
      }

      .quote-btn{
        margin-top:14px;
      }
    }
  </style>
</head>

<body>

<header class="site-header">
  <div class="header-container">

    <a class="brand" href="index.html" aria-label="Formosa Taffeta Composite Materials home">
      <img
        src="images/logo.png"
        alt="Formosa Taffeta Co., Ltd. Composite Materials"
      >
    </a>

    <button
      class="menu-toggle"
      type="button"
      aria-label="Open menu"
      aria-expanded="false"
    >
      ☰
    </button>

    <nav class="main-nav" aria-label="Primary navigation">
      <a class="active" href="index.html">Home</a>
      <a href="index.html#about">About</a>
      <a href="index.html#products">Products</a>
      <a href="index.html#applications">Applications</a>
      <a href="downloads.html">Downloads</a>
      <a href="index.html#contact">Contact</a>
      <a class="quote-btn" href="index.html#contact">Request a Quote</a>
    </nav>

  </div>
</header>

<script>
  const menuToggle = document.querySelector(".menu-toggle");
  const mainNav = document.querySelector(".main-nav");

  menuToggle.addEventListener("click", function () {
    mainNav.classList.toggle("open");

    const isOpen = mainNav.classList.contains("open");
    menuToggle.setAttribute("aria-expanded", isOpen);
  });
</script>

</body>
</html>
